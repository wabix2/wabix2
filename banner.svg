<svg width="760" height="220" viewBox="0 0 760 220" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, 'Fira Code', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#050708"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="760" height="220" rx="10" fill="url(#bg)" stroke="#1f2630" stroke-width="1"/>

  <!-- title bar -->
  <rect width="760" height="30" rx="10" fill="#11161d"/>
  <rect y="20" width="760" height="10" fill="#11161d"/>
  <circle cx="20" cy="15" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="15" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="15" r="6" fill="#27c93f"/>
  <text x="380" y="19" fill="#5c6470" font-size="12" text-anchor="middle">wabi@addis-ababa: ~</text>

  <!-- scanlines -->
  <g opacity="0.035">
    <rect x="0" y="30" width="760" height="190" fill="url(#bg)"/>
    <path d="M0 34 H760 M0 44 H760 M0 54 H760 M0 64 H760 M0 74 H760 M0 84 H760 M0 94 H760 M0 104 H760 M0 114 H760 M0 124 H760 M0 134 H760 M0 144 H760 M0 154 H760 M0 164 H760 M0 174 H760 M0 184 H760 M0 194 H760 M0 204 H760" stroke="#00ff9c" stroke-width="1"/>
  </g>

  <!-- terminal text -->
  <g font-size="15" fill="#00ff9c" filter="url(#glow)">
    <text x="24" y="58"><tspan fill="#5c6470">$</tspan> whoami</text>
    <text x="24" y="82" fill="#e6edf3">wabi — self-taught developer &amp; AI builder</text>

    <text x="24" y="112"><tspan fill="#5c6470">$</tspan> cat location.txt</text>
    <text x="24" y="136" fill="#e6edf3">Addis Ababa, Ethiopia 🇪🇹</text>

    <text x="24" y="166"><tspan fill="#5c6470">$</tspan> ./philosophy --run</text>
    <text x="24" y="190" fill="#e6edf3">depth &gt; breadth. ship real products, not résumés.</text>
  </g>

  <!-- blinking cursor -->
  <rect x="24" y="196" width="9" height="14" fill="#00ff9c">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <text x="38" y="207" font-size="15" fill="#5c6470">_</text>
</svg>
